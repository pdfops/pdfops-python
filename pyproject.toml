[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pdfops"
version = "0.2.0"
description = "Python client for the PDFops API: fill AcroForm PDFs, merge and split PDFs, page operations (extract, delete, rotate, watermark, page numbers), protect and unlock, edit metadata, inspect form fields, generate invoices. One HTTP call, no native deps, no headless browser."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "PDFops", email = "hello@pdfops.dev" }]
keywords = ["pdf", "acroform", "fill-pdf", "merge-pdf", "pdf-forms", "invoice", "pypdf", "pdf-api", "split-pdf", "rotate-pdf", "watermark-pdf", "pdf-metadata", "protect-pdf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://pdfops.dev"
Documentation = "https://pdfops.dev/docs"
"Fill a PDF in Python" = "https://pdfops.dev/fill-pdf-in-python"
Source = "https://github.com/pdfops/pdfops-python"
Issues = "https://github.com/pdfops/pdfops-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfops"]

[tool.hatch.build.targets.sdist]
include = ["src/pdfops", "README.md", "LICENSE", "pyproject.toml", "tests"]
